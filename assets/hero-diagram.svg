<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Import Google Font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      .title-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 22px;
        fill: #1E3A27;
      }
      .subtitle-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 14px;
        fill: #4A6B56;
      }
      .badge-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 10px;
        fill: #FCFAF5;
        letter-spacing: 0.5px;
      }
    </style>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F3EDE0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#FCFAF5" rx="16"/>
  <rect width="1200" height="500" fill="url(#grid)" rx="16"/>

  <!-- Subtle connecting flow lines in the background -->
  <path d="M 260 250 Q 430 220 600 250 Q 770 280 940 250" fill="none" stroke="#1E3A27" stroke-width="2" stroke-dasharray="8 8" opacity="0.08"/>

  <!-- ==================== NODE 1: INTENT SIGNAL ==================== -->
  <!-- Main Card -->
  <rect x="120" y="160" width="280" height="180" rx="16" fill="#E6F5EE" stroke="#C6E8D7" stroke-width="1.5"/>
  
  <!-- Step Badge -->
  <rect x="225" y="149" width="70" height="22" rx="11" fill="#D27C58"/>
  <text x="260" y="164" class="badge-text" text-anchor="middle">STEP 01</text>

  <!-- Abstract Signal Symbol -->
  <g transform="translate(260, 215)">
    <!-- Base Wave Radar -->
    <circle cx="0" cy="0" r="6" fill="#D27C58"/>
    <circle cx="0" cy="0" r="18" stroke="#1E3A27" stroke-width="2.5" fill="none" opacity="0.8" stroke-dasharray="4 5"/>
    <circle cx="0" cy="0" r="32" stroke="#1E3A27" stroke-width="2.5" fill="none" opacity="0.4" stroke-dasharray="6 7"/>
    <!-- Orbiting Nodes -->
    <circle cx="13" cy="-13" r="3.5" fill="#1E3A27"/>
    <circle cx="-22" cy="22" r="3.5" fill="#1E3A27"/>
  </g>

  <!-- Texts -->
  <text x="260" y="282" class="title-text" text-anchor="middle">Intent Signal</text>
  <text x="260" y="305" class="subtitle-text" text-anchor="middle">Inbound interest captured</text>


  <!-- ==================== NODE 2: DEMO DESK ==================== -->
  <!-- Main Card -->
  <rect x="460" y="160" width="280" height="180" rx="16" fill="#E6F5EE" stroke="#C6E8D7" stroke-width="1.5"/>

  <!-- Step Badge -->
  <rect x="565" y="149" width="70" height="22" rx="11" fill="#D27C58"/>
  <text x="600" y="164" class="badge-text" text-anchor="middle">STEP 02</text>

  <!-- Abstract Desk Routing Symbol -->
  <g transform="translate(600, 215)">
    <!-- Desk silhouette -->
    <path d="M -32 12 L 32 12" stroke="#1E3A27" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -20 12 L -20 26" stroke="#1E3A27" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 12 L 20 26" stroke="#1E3A27" stroke-width="3" stroke-linecap="round"/>
    <!-- Routing Paths -->
    <path d="M -28 -20 Q -14 -8 0 -8 Q 14 -8 28 -20" fill="none" stroke="#1E3A27" stroke-width="2" stroke-linecap="round" opacity="0.5" stroke-dasharray="3 3"/>
    <path d="M -28 -4 Q -14 -8 0 -8 Q 14 -8 28 -4" fill="none" stroke="#1E3A27" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Routing Hub and Nodes -->
    <circle cx="0" cy="-8" r="7" fill="#D27C58"/>
    <circle cx="-14" cy="-11" r="3.5" fill="#1E3A27"/>
    <circle cx="14" cy="-11" r="3.5" fill="#1E3A27"/>
  </g>

  <!-- Texts -->
  <text x="600" y="282" class="title-text" text-anchor="middle">Demo Desk</text>
  <text x="600" y="305" class="subtitle-text" text-anchor="middle">Intent classified and routed</text>


  <!-- ==================== NODE 3: ACTION ==================== -->
  <!-- Main Card -->
  <rect x="800" y="160" width="280" height="180" rx="16" fill="#E6F5EE" stroke="#C6E8D7" stroke-width="1.5"/>

  <!-- Step Badge -->
  <rect x="905" y="149" width="70" height="22" rx="11" fill="#D27C58"/>
  <text x="940" y="164" class="badge-text" text-anchor="middle">STEP 03</text>

  <!-- Abstract Action Symbol -->
  <g transform="translate(940, 215)">
    <!-- Target -->
    <circle cx="0" cy="5" r="17" stroke="#1E3A27" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="5" r="25" stroke="#1E3A27" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.5"/>
    <circle cx="0" cy="5" r="5" fill="#D27C58"/>
    <!-- Arrow -->
    <path d="M 26 -21 L 6 -1" stroke="#D27C58" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 6 -9 L 6 -1 L 14 -1" stroke="#D27C58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Texts -->
  <text x="940" y="282" class="title-text" text-anchor="middle">Action</text>
  <text x="940" y="305" class="subtitle-text" text-anchor="middle">Useful follow-up within minutes</text>


  <!-- ==================== CONNECTING ARROWS ==================== -->
  <!-- Arrow 1 (Node 1 -> Node 2) -->
  <g>
    <circle cx="412" cy="250" r="3.5" fill="#D27C58"/>
    <path d="M 415 250 L 448 250" stroke="#D27C58" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 442 244 L 448 250 L 442 256" stroke="#D27C58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Arrow 2 (Node 2 -> Node 3) -->
  <g>
    <circle cx="752" cy="250" r="3.5" fill="#D27C58"/>
    <path d="M 755 250 L 788 250" stroke="#D27C58" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 782 244 L 788 250 L 782 256" stroke="#D27C58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
